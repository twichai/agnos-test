info:
  name: patient-search-query
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/patient/search"
  body:
    type: json
    data: |-
      {
        "national_id": "",
        "passport_id": "",
        "first_name": "",
        "middle_name": "",
        "last_name": "",
        "date_of_birth": "",
        "phone_number": "",
        "email": ""
      }
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
