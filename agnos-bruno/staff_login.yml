info:
  name: staff-login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/staff/login"
  body:
    type: json
    data: |-
      {
        "username": "staff_a",
        "password": "1234",
        "hospital_id": "{{hospitalID}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.Token)
        {
          bru.setEnvVar("authToken", res.body.Token);    
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
